# Read-only plan of dev on every pull request, so reviewers can read the diff before merge.
#
# Uses the per-environment *plan* role: read-only AWS access plus that environment's state
# prefix. The job holds the plan CI user's key (repository secrets) whose only permission is
# to assume that role (bootstrap/ci_access.tf). Skipped, not failed, until the bootstrap has
# been applied and the repository variables and secrets are set (see docs/operations.md).
name: Plan

on:
  pull_request:
    paths:
      - "live/**"
      - "modules/**"
      - ".tool-versions"
      - ".github/workflows/plan.yml"

permissions:
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-dev:
    name: Plan dev
    # Fork pull requests are given no secrets, so they are skipped rather than left to fail.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AWS_PLAN_ROLE_ARN_DEV != '' &&
      vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ENVIRONMENT: dev
      TG_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      # Secret so addresses (PII) stay out of the repository; GitHub masks it in logs.
      ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
      DEV_CERTIFICATE_ARN: ${{ vars.DEV_CERTIFICATE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: asdf-vm/actions/setup@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
      - uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

      # Single source of truth for the region is the environment's env.hcl.
      - name: Read region from env.hcl
        run: |
          region="$(sed -n 's/^ *region *= *"\(.*\)".*/\1/p' "live/${ENVIRONMENT}/env.hcl")"
          [ -n "${region}" ] || { echo "region not found in live/${ENVIRONMENT}/env.hcl" >&2; exit 1; }
          echo "AWS_REGION=${region}" >> "${GITHUB_ENV}"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_PLAN_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_PLAN_SECRET_ACCESS_KEY_DEV }}
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN_DEV }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      # The full plan goes to the job log only. Plans and plan files are never uploaded as
      # artifacts because they can embed secret values. The summary shows counts only.
      - name: terragrunt plan
        run: |
          terragrunt run --all --non-interactive --working-dir "live/${ENVIRONMENT}" \
            -- plan -input=false -no-color -lock-timeout=5m 2>&1 | tee "${RUNNER_TEMP}/plan.log"
          {
            echo "### Plan: ${ENVIRONMENT}"
            echo '```'
            # Terragrunt prefixes each line with the unit name, so do not anchor the match.
            grep -E 'Plan: [0-9]+ to add|No changes\.' "${RUNNER_TEMP}/plan.log" || echo "see job log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
